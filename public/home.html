<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>スケジュール管理アプリ</title>
    <link rel="icon" type="image/x-icon" href="/image/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="function.js?v=2"></script>
    <style>
        body, html {
            margin: 10px;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        a {
            color: #000000;
            text-decoration: none;
        }
        .fc-holiday-name {
            position: relative;
            z-index: 4;
            padding: 4px;
            text-align: left;
            color: #FF0000;
        }
        .fc .fc-daygrid-day-top {
            justify-content: space-between;
        }
        #editEventStartDay, #editEventEndDay {
            margin-bottom: 15px;
        }
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        #calendar {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            margin-bottom: 5px;
        }
        .fc-view-harness {
            flex: 1 1 auto;
        }
        .fc-daygrid-body {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .fc-daygrid-day-frame {
            flex: 1 1 auto;
            height: calc((100vh - 150px) / 5);
            min-height: 0;
            overflow-y: auto;
        }

        .input-wrapper {
            position: relative;
            display: inline-block;
            width: 200px; /* 適宜調整 */
        }

        .form-control {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        .reset-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0; /* 完全に透明 */
        }

        @media screen and (max-width: 768px) {
            body, html {
                margin: 0;
                margin-top: 10px;
            }
            .fc-daygrid-day-frame {
                height: calc((100vh - 260px) / 5);
            }
            .container, .container-fluid, .container-lg, .container-md, .container-sm, .container-xl, .container-xxl {
                padding: 0;
            }
        }
    </style>
    <style>
        body {
            overflow: hidden;
            overflow-y: scroll;
            -ms-overflow-style: none;  /* Internet Explorer 10+ */
            scrollbar-width: none;  /* Firefox */
        }

        ::-webkit-scrollbar {
            display: none;  /* Chrome, Safari */
        }
    </style>
    <style>
        .time-picker-container {
            position: relative;
            width: 100%;
        }

        /* 🔹 `datalist` は非表示にする */
        datalist {
            display: none;
        }

        /* 🔹 カスタムドロップダウン */
        .time-dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            width: 50%;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 1000;
            display: none; /* 初期状態は非表示 */
        }

        /* 🔹 候補スタイル */
        .time-option {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
            background: white;
            color: black;
        }

        /* 🔹 マウスオーバー時の選択 */
        .time-option:hover {
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">

        <div id="calendar"></div>
    </div>

    <!-- イベント追加モーダル -->
    <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="eventModalLabel">イベントを追加</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="eventForm">
                        <div class="mb-3">
                            <label for="eventTitle" class="form-label">イベントのタイトル</label>
                            <input type="text" class="form-control" id="eventTitle" tabindex="1" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventColor" class="form-label">イベントのカラー</label>
                            <select class="form-select" id="eventColor" tabindex="2">
                                <option disabled>カラーを選択してください</option>
                                <option value="#dc3545">レッド</option>
                                <option value="#fd7e14">オレンジ</option>
                                <option value="#ffc107">イエロー</option>
                                <option value="#e83e8c">ピンク</option>
                                <option value="#007bff">ブルー</option>
                                <option value="#17a2b8">ライトブルー</option>
                                <option value="#28a745">グリーン</option>
                                <option value="#20c997">エメラルド</option>
                                <option value="#6f42c1">パープル</option>
                                <option value="#795548">ブラウン</option>
                                <option value="#343a40">ブラック</option>
                                <option value="#a8a8a8">シルバー</option>
                                <option value="#f8f9fa">グレー</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="eventDescription" class="form-label">イベントの説明</label>
                            <textarea class="form-control" id="eventDescription" rows="3" tabindex="3"></textarea>
                        </div>
                        <div class="mb-3" id="startTimeContainer">
                            <label for="eventStartTime" class="form-label">開始時間</label>
                            <div id="startInput"></div>
                        </div>
                        <div class="mb-3" id="endTimeContainer">
                            <label for="eventEndTime" class="form-label">終了時間</label>
                            <div id="endInput"></div>
                        </div>
                        <input type="hidden" id="eventStartDate">
                        <input type="hidden" id="eventEndDate">
                    </form>
                </div>
                <div class="modal-footer">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="keepEventValues" checked>
                        <label class="form-check-label" for="keepEventValues">入力内容をリセット</label>
                    </div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-primary" id="saveEventButton" tabindex="5">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- イベント編集用モーダル -->
    <div class="modal fade" id="editEventModal" tabindex="-1" aria-labelledby="editEventModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editEventModalLabel">イベントを編集</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editEventForm">
                        <input type="hidden" id="editEventId">
                        <div class="mb-3">
                            <label for="editEventTitle" class="form-label">イベントのタイトル</label>
                            <input type="text" class="form-control" id="editEventTitle" tabindex="1" required>
                        </div>
                        <div class="mb-3">
                            <label for="editEventColor" class="form-label">イベントのカラー</label>
                            <select class="form-select" id="editEventColor" tabindex="2">
                                <option disabled>カラーを選択してください</option>
                                <option value="#dc3545">レッド</option>
                                <option value="#fd7e14">オレンジ</option>
                                <option value="#ffc107">イエロー</option>
                                <option value="#e83e8c">ピンク</option>
                                <option value="#007bff">ブルー</option>
                                <option value="#17a2b8">ライトブルー</option>
                                <option value="#28a745">グリーン</option>
                                <option value="#20c997">エメラルド</option>
                                <option value="#6f42c1">パープル</option>
                                <option value="#795548">ブラウン</option>
                                <option value="#343a40">ブラック</option>
                                <option value="#a8a8a8">シルバー</option>
                                <option value="#f8f9fa">グレー</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editEventDescription" class="form-label">イベントの説明</label>
                            <textarea class="form-control" id="editEventDescription" rows="3" tabindex="3"></textarea>
                        </div>
                        <div class="mb-3" id="editStartTimeContainer">
                            <label for="eventStartTime" class="form-label">開始時間</label>
                            <div id="editStartInput"></div>
                        </div>
                        <div class="mb-3" id="editEndTimeContainer">
                            <label for="eventEndTime" class="form-label">終了時間</label>
                            <div id="editEndInput"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="deleteEventButton">削除</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-primary" id="saveEditEventButton" tabindex="5">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var calendarEl = document.getElementById('calendar');
        var eventModal = new bootstrap.Modal(document.getElementById('eventModal'), {});
        var editEventModal = new bootstrap.Modal(document.getElementById('editEventModal'), {});

        let userID = null;
        var holidays = null;

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                userID = await fetch('/api/user').then(response => response.json()).then(user => user.userID);
                if (!userID) {
                    alert('ログインしてください！');
                    window.location.href = '/login';
                    return;
                }
                initCalendar();
            } catch (error) {
                console.error('Failed to fetch user ID:', error);
                alert('ユーザーIDの取得に失敗しました。ログインしてください。');
                window.location.href = '/login';
            }
            // 新規作成（時間のみ）
            createTimeInputField('startInput', 'eventStartDate', 'eventStartTime', 'eventStartTimeSelect', false);
            createTimeInputField('endInput', 'eventEndDate', 'eventEndTime', 'eventEndTimeSelect', false);

            // 編集（日付 + 時間）
            createTimeInputField('editStartInput', 'editEventStartDay', 'editEventStartTime', 'editEventStartTimeSelect', true);
            createTimeInputField('editEndInput', 'editEventEndDay', 'editEventEndTime', 'editEventEndTimeSelect', true);

            setupTimeDropdown("eventStartTime", "timeList");
            setupTimeDropdown("eventEndTime", "timeList");
            setupTimeDropdown("editEventStartTime", "timeList");
            setupTimeDropdown("editEventEndTime", "timeList");
        });

        document.getElementById('eventModal').addEventListener('shown.bs.modal', function () {
            document.getElementById('eventTitle').focus();
        });

        document.getElementById('editEventModal').addEventListener('shown.bs.modal', function () {
            document.getElementById('editEventTitle').focus();
        });

        async function initCalendar() {
            if (!holidays) holidays = await fetchHolidays();
            var calendar = new FullCalendar.Calendar(calendarEl, {
                timeZone: 'Asia/Tokyo',
                locale: 'ja',
                navLinks: false,
                initialView: 'dayGridMonth',
                fixedWeekCount: false,
                height: 'auto',
                expandRows: true,
                slotLabelFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },
                eventTimeFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },
                dayCellDidMount: async function(info) {
                    info.dayNumberText = info.dayNumberText.replace('日', '');

                    if (info.date.getDay() === 0) info.el.style.backgroundColor = '#f8d7da';
                    if (info.date.getDay() === 6) info.el.style.backgroundColor = '#d1ecf1';

                    if (holidays[info.date.toISOString().slice(0, 10)]) {
                        info.el.style.backgroundColor = '#f8d7da';

                        if (!isMobileDevice()) {
                            const holidayName = document.createElement('div');
                            holidayName.className = 'fc-holiday-name';
                            holidayName.innerHTML = holidays[info.date.toISOString().slice(0, 10)];
                            const dayTopEl = info.el.querySelector('.fc-daygrid-day-top');
                            dayTopEl.appendChild(holidayName);
                        }
                    }
                },
                events: async function(fetchInfo, successCallback, failureCallback) {
                    try {
                        const data = await fetch(`/api/schedules?start=${fetchInfo.startStr}&end=${fetchInfo.endStr}&userID=${userID}`).then(response => response.json());
                        let events = data;

                        if (isMobileDevice()) {
                            events = data.concat(Object.keys(holidays).map(date => ({
                                title: holidays[date],
                                start: date,
                                allDay: true,
                                color: '#FF0000'
                            })));
                        }

                        successCallback(events);
                    } catch (error) {
                        failureCallback(error);
                    }
                },
                selectable: true,
                selectLongPressDelay: 1,
                select: function(info){
                    let endStr = new Date(info.endStr);
                    endStr.setDate(endStr.getDate() - 1);
                    endStr = endStr.toISOString().slice(0, 10);

                    document.getElementById('eventStartDate').value = info.startStr.slice(0, 10);
                    document.getElementById('eventEndDate').value = endStr;
                    eventModal.show();
                },
                eventClick: function(info) {
                    // フォーム要素を取得
                    const editEventId = document.getElementById('editEventId');
                    const editEventTitle = document.getElementById('editEventTitle');
                    const editEventColor = document.getElementById('editEventColor');
                    const editEventDescription = document.getElementById('editEventDescription');
                    const editEventStartDay = document.getElementById('editEventStartDay');
                    const editEventStartTime = document.getElementById('editEventStartTime');
                    const editEventEndDay = document.getElementById('editEventEndDay');
                    const editEventEndTime = document.getElementById('editEventEndTime');

                    // フィールドに値をセット
                    editEventId.value = info.event.id;
                    editEventTitle.value = info.event.title;
                    editEventColor.value = info.event.backgroundColor;
                    editEventDescription.value = info.event.extendedProps.description || '';

                    // 編集時は日付と時間を分離してセット
                    editEventStartDay.value = info.event.start.toISOString().split('T')[0];
                    editEventStartTime.value = info.event.start.toISOString().split('T')[1].slice(0, 5);

                    editEventEndDay.value = info.event.end ? info.event.end.toISOString().split('T')[0] : '';
                    editEventEndTime.value = info.event.end ? info.event.end.toISOString().split('T')[1].slice(0, 5) : '';

                    editEventModal.show();
                },
                eventColor: function(event) {
                    return event.color;
                }
            });

            document.getElementById('saveEventButton').addEventListener('click', function() {
                var title = document.getElementById('eventTitle').value;
                var color = document.getElementById('eventColor').value;
                var description = document.getElementById('eventDescription').value;
                var startDate = document.getElementById('eventStartDate').value;
                var startTime = document.getElementById('eventStartTime').value;
                var endDate = document.getElementById('eventEndDate').value;
                var endTime = document.getElementById('eventEndTime').value;
                
                if (title) {
                    var start = `${startDate}T${startTime}`;
                    var end = `${endDate}T${endTime}`;
                    console.log(start, end)

                    fetch('/api/schedules', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            userID: userID,
                            title: title,
                            start: start,
                            end: end ? end : null,
                            description: description,
                            color: color
                        })
                    }).then(response => response.json()).then(event => {
                        calendar.addEvent(event);
                    }).catch(error => {
                        alert('イベントの追加に失敗しました！');
                    });
                    eventModal.hide();
                    if (document.getElementById('keepEventValues').checked) {
                        resetEventForm();
                    }
                }
            });

            document.getElementById('saveEditEventButton').addEventListener('click', async function() {
                var eventId = document.getElementById('editEventId').value;
                var title = document.getElementById('editEventTitle').value;
                var color = document.getElementById('editEventColor').value;
                var description = document.getElementById('editEventDescription').value;
                var editEventStartDay = document.getElementById('editEventStartDay').value;
                var editEventStartTime = document.getElementById('editEventStartTime').value;
                var editEventEndDay = document.getElementById('editEventEndDay').value;
                var editEventEndTime = document.getElementById('editEventEndTime').value;

                if (title) {
                    var start = `${editEventStartDay}T${editEventStartTime}:00`;
                    var end = editEventEndDay ? `${editEventEndDay}T${editEventEndTime}:00` : null;
                    console.log(start, end)
                    
                    fetch(`/api/schedules/${eventId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            userID: userID,
                            title: title,
                            start: start,
                            end: end ? end : null,
                            description: description,
                            color: color
                        })
                    }).then(response => response.json()).then(event => {
                        calendar.getEventById(eventId).remove();
                        calendar.addEvent(event);
                    }).catch(error => {
                        alert('イベントの追加に失敗しました！');
                    });
                    editEventModal.hide();
                }
            });

            document.getElementById('deleteEventButton').addEventListener('click', async function() {
                const eventId = document.getElementById('editEventId').value;

                try {
                    await fetch(`/api/schedules/${eventId}/${userID}`, {
                        method: 'DELETE'
                    });

                    // イベントを削除
                    const event = calendar.getEventById(eventId).remove();

                    editEventModal.hide();
                } catch (error) {
                    alert('イベントの削除に失敗しました！');
                }
            });
            
            calendar.render();
        }
    </script>
</body>
</html>
